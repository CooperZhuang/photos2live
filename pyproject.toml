[project]
name = "photo2video"
version = "0.1.0"
description = "把有序照片合成延时/幻灯片视频"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
osxphotos = ["osxphotos>=0.68.0"]

[project.scripts]
photo2video = "photo2video.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
